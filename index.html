<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChucksHub - Shop Everything</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f5f5f7; color: #1a1a1a; }
  header { background: #0f172a; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 22px; font-weight: 700; color: #fbbf24; }
  header .cart-btn { background: #fbbf24; color: #0f172a; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .hero { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; text-align: center; padding: 60px 20px; }
  .hero h2 { font-size: 32px; margin-bottom: 10px; }
  .hero p { color: #cbd5e1; font-size: 16px; }
  .categories { display: flex; gap: 10px; overflow-x: auto; padding: 16px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  .categories button { background: #f1f5f9; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .categories button.active { background: #0f172a; color: #fbbf24; }
  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding: 24px; }
  .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; }
  .product-card:hover { transform: translateY(-4px); }
  .product-card img { width: 100%; height: 150px; object-fit: cover; background: #e5e7eb; }
  .product-info { padding: 12px; }
  .product-info h3 { font-size: 14px; margin-bottom: 6px; }
  .product-info .price { color: #0f172a; font-weight: 700; font-size: 16px; margin-bottom: 8px; }
  .product-info button { width: 100%; background: #0f172a; color: #fbbf24; border: none; padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .cart-overlay { display: none; position: fixed; top: 0; right: 0; width: 100%; max-width: 380px; height: 100%; background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,0.15); z-index: 200; flex-direction: column; }
  .cart-overlay.open { display: flex; }
  .cart-header { padding: 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  .cart-header button { background: none; border: none; font-size: 22px; cursor: pointer; }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
  .cart-item .qty-controls { display: flex; align-items: center; gap: 8px; }
  .cart-item .qty-controls button { width: 24px; height: 24px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
  .cart-footer { padding: 20px; border-top: 1px solid #e5e7eb; }
  .cart-footer .total { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .cart-footer button { width: 100%; background: #fbbf24; color: #0f172a; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .checkout-form { padding: 20px; display: none; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .checkout-form.open { display: flex; }
  .checkout-form input, .checkout-form textarea { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .empty-msg { text-align: center; color: #9ca3af; padding: 40px 0; }
  .overlay-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 150; }
  .overlay-bg.open { display: block; }
  footer { text-align: center; padding: 24px; color: #6b7280; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>ChucksHub</h1>
  <button class="cart-btn" onclick="toggleCart(true)">Cart (<span id="cartCount">0</span>)</button>
</header>

<div class="hero">
  <h2>Everything you need, in one place</h2>
  <p>Quality products, fast delivery, secure payment</p>
</div>

<div class="categories" id="categoryBar">
  <button class="active" data-cat="all" onclick="filterCategory('all', this)">All</button>
</div>

<div class="products" id="productGrid">
  <p class="empty-msg">Loading products...</p>
</div>

<footer>&copy; 2026 ChucksHub. All rights reserved.</footer>

<div class="overlay-bg" id="overlayBg" onclick="toggleCart(false)"></div>
<div class="cart-overlay" id="cartOverlay">
  <div class="cart-header">
    <strong>Your Cart</strong>
    <button onclick="toggleCart(false)">&times;</button>
  </div>
  <div class="cart-items" id="cartItemsList">
    <p class="empty-msg">Your cart is empty</p>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="total"><span>Total</span><span id="cartTotal">₦0</span></div>
    <button onclick="showCheckoutForm()">Proceed to Checkout</button>
  </div>
  <form class="checkout-form" id="checkoutForm">
    <input type="text" id="custName" placeholder="Full Name" required>
    <input type="email" id="custEmail" placeholder="Email Address" required>
    <input type="tel" id="custPhone" placeholder="Phone Number" required>
    <textarea id="custAddress" placeholder="Delivery Address" rows="3" required></textarea>
    <div class="total"><span>Total</span><span id="checkoutTotal">₦0</span></div>
    <button type="submit" style="background:#fbbf24;color:#0f172a;border:none;padding:14px;border-radius:8px;font-weight:700;cursor:pointer;">Pay with Flutterwave</button>
  </form>
</div>

<script src="https://checkout.flutterwave.com/v3.js"></script>
<script>
  const API_BASE = 'https://chuckshub-backend.onrender.com/api';
  const FLW_PUBLIC_KEY = 'YOUR_FLUTTERWAVE_PUBLIC_KEY'; // we'll replace this later

  let allProducts = [];
  let cart = [];

  async function loadProducts() {
    try {
      const res = await fetch(`${API_BASE}/products`);
      allProducts = await res.json();
      renderCategories();
      renderProducts(allProducts);
    } catch (err) {
      document.getElementById('productGrid').innerHTML = '<p class="empty-msg">Could not load products. Please try again later.</p>';
    }
  }

  function renderCategories() {
    const cats = ['all', ...new Set(allProducts.map(p => p.category))];
    const bar = document.getElementById('categoryBar');
    bar.innerHTML = cats.map(c => `<button class="${c==='all'?'active':''}" data-cat="${c}" onclick="filterCategory('${c}', this)">${c === 'all' ? 'All' : c}</button>`).join('');
  }

  function filterCategory(cat, btn) {
    document.querySelectorAll('.categories button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat);
    renderProducts(filtered);
  }

  function renderProducts(products) {
    const grid = document.getElementById('productGrid');
    if (!products.length) {
      grid.innerHTML = '<p class="empty-msg">No products available yet.</p>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="product-card">
        <img src="${p.image || 'https://via.placeholder.com/300x200?text=ChucksHub'}" alt="${p.name}">
        <div class="product-info">
          <h3>${p.name}</h3>
          <div class="price">₦${p.price.toLocaleString()}</div>
          <button onclick="addToCart('${p._id}')">Add to Cart</button>
        </div>
      </div>
    `).join('');
  }

  function addToCart(id) {
    const product = allProducts.find(p => p._id === id);
    const existing = cart.find(item => item._id === id);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ ...product, qty: 1 });
    }
    renderCart();
  }

  function changeQty(id, delta) {
    const item = cart.find(i => i._id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      cart = cart.filter(i => i._id !== id);
    }
    renderCart();
  }

  function renderCart() {
    const list = document.getElementById('cartItemsList');
    const footer = document.getElementById('cartFooter');
    const countEl = document.getElementById('cartCount');
    countEl.textContent = cart.reduce((sum, i) => sum + i.qty, 0);

    if (!cart.length) {
      list.innerHTML = '<p class="empty-msg">Your cart is empty</p>';
      footer.style.display = 'none';
      return;
    }

    list.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div>
          <div>${item.name}</div>
          <small>₦${item.price.toLocaleString()}</small>
        </div>
        <div class="qty-controls">
          <button onclick="changeQty('${item._id}', -1)">-</button>
          <span>${item.qty}</span>
          <button onclick="changeQty('${item._id}', 1)">+</button>
        </div>
      </div>
    `).join('');

    const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    document.getElementById('cartTotal').textContent = `₦${total.toLocaleString()}`;
    document.getElementById('checkoutTotal').textContent = `₦${total.toLocaleString()}`;
    footer.style.display = 'block';
  }

  function toggleCart(open) {
    document.getElementById('cartOverlay').classList.toggle('open', open);
    document.getElementById('overlayBg').classList.toggle('open', open);
    if (!open) {
      document.getElementById('checkoutForm').classList.remove('open');
      document.getElementById('cartItemsList').style.display = 'block';
      document.getElementById('cartFooter').style.display = cart.length ? 'block' : 'none';
    }
  }

  function showCheckoutForm() {
    document.getElementById('cartItemsList').style.display = 'none';
    document.getElementById('cartFooter').style.display = 'none';
    document.getElementById('checkoutForm').classList.add('open');
  }

  document.getElementById('checkoutForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const name = document.getElementById('custName').value;
    const email = document.getElementById('custEmail').value;
    const phone = document.getElementById('custPhone').value;
    const address = document.getElementById('custAddress').value;

    FlutterwaveCheckout({
      public_key: FLW_PUBLIC_KEY,
      tx_ref: 'chuckshub-' + Date.now(),
      amount: total,
      currency: 'NGN',
      payment_options: 'card,banktransfer,ussd',
      customer: { email: email, phone_number: phone, name: name },
      customizations: { title: 'ChucksHub', description: 'Payment for items in cart' },
      callback: async function (data) {
        if (data.status === 'successful') {
          await fetch(`${API_BASE}/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerName: name,
              customerEmail: email,
              customerPhone: phone,
              deliveryAddress: address,
              items: cart.map(i => ({ product: i._id, name: i.name, price: i.price, quantity: i.qty })),
              totalAmount: total,
              paymentReference: data.transaction_id
            })
          });
          alert('Order placed successfully! Thank you for shopping with ChucksHub.');
          cart = [];
          renderCart();
          toggleCart(false);
        }
      },
      onclose: function () {}
    });
  });

  loadProducts();
</script>

</body>
</html>
